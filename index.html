<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kas RT</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 15px;
    }

    header {
      background: #198754;
      color: white;
      padding: 20px;
      text-align: center;
      border-radius: 0 0 15px 15px;
    }

    header h1 {
      margin: 0;
    }

    .card {
      background: white;
      margin-top: 15px;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h2,
    .card h3 {
      margin-top: 0;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      font-size: 16px;
    }

    input,
    select {
      border: 1px solid #ccc;
    }

    button {
      border: none;
      cursor: pointer;
      color: white;
    }

    .btn-masuk {
      background: #198754;
    }

    .btn-masuk:active {
      background: #146c43;
    }

    .ringkasan {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .ringkasan .box {
      padding: 15px;
      border-radius: 10px;
      background: #f8f9fa;
    }

    .box span {
      display: block;
      color: #666;
      margin-bottom: 5px;
    }

    .box strong {
      font-size: 20px;
    }

    .transaksi {
      border: 1px solid #ddd;
      padding: 15px;
      margin-top: 10px;
      border-radius: 10px;
    }

    .transaksi-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-weight: bold;
    }

    .transaksi small {
      display: block;
      margin-top: 8px;
      color: #777;
    }

    .masuk {
      color: #198754;
    }

    .keluar {
      color: #dc3545;
    }

    .hapus {
      background: #dc3545;
      margin-top: 10px;
    }

    .edit {
      background: #0d6efd;
      margin-top: 10px;
    }

    footer {
      text-align: center;
      padding: 25px 10px;
      color: #777;
    }

    .kosong {
      text-align: center;
      color: #777;
      padding: 20px 5px;
    }
    /* MENU UTAMA */
.menu {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 10px 15px;
  background: white;
  border-bottom: 1px solid #ddd;
}

.menu a {
  flex: 0 0 auto;
  text-decoration: none;
  color: #333;
  background: #f1f3f5;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: bold;
}

.menu a.aktif {
  background: #198754;
  color: white;
}

.menu a:hover {
  background: #198754;
  color: white;
}
.tambah {
  background: #198754 !important;
  color: white !important;
  border: none !important;
}
.tambah,
.tambah:disabled {
    background: #198754 !important;
    color: white !important;
    opacity: 1 !important;
    border: none !important;
}
  </style>
</head>

<body>

  <header>
    <h1>💰 Kas RT</h1>
    <p>Sistem Informasi Kas RT</p>
  </header>
  <nav class="menu">
  <a href="#" class="aktif">💰 Kas RT</a>
  <a href="#warga">👥 Data Warga</a>
  <a href="#laporan">📊 Laporan</a>
  <a href="#kegiatan">📅 Kegiatan</a>
  <a href="#pengaturan">⚙️ Pengaturan</a>
</nav>

<div class="container">

<!-- DATA WARGA -->
<div class="card" id="warga">
  <h3>👥 Data Warga</h3>

  <input
    type="text"
    id="namaWarga"
    placeholder="Nama warga"
  >

  <input
    type="text"
    id="rumahWarga"
    placeholder="Nomor rumah"
  >

  <input
    type="text"
    id="hpWarga"
    placeholder="Nomor HP"
  >

  <button
    type="button"
    class="tambah"
    onclick="tambahWarga()"
  >
    ➕ Tambah Warga
  </button>

  <div id="daftarWarga"></div>
</div>

<!-- RINGKASAN -->
    <!-- RINGKASAN -->
    <div class="card">
      <h3>📊 Ringkasan Kas</h3>

      <div class="ringkasan">

        <div class="box">
          <span>Pemasukan</span>
          <strong id="pemasukan">Rp 0</strong>
        </div>

        <div class="box">
          <span>Pengeluaran</span>
          <strong id="pengeluaran">Rp 0</strong>
        </div>

        <div class="box">
          <span>Saldo</span>
          <strong id="saldo">Rp 0</strong>
        </div>

      </div>
    </div>


    <!-- TAMBAH TRANSAKSI -->
    <div class="card">

      <h3>➕ Tambah Transaksi</h3>

      <input
        id="keterangan"
        type="text"
        placeholder="Contoh: Iuran warga"
      >

      <input
        id="jumlah"
        type="number"
        placeholder="Jumlah uang"
        min="1"
      >

      <select id="jenis">
        <option value="masuk">Pemasukan</option>
        <option value="keluar">Pengeluaran</option>
      </select>

      <button
        type="button"
        class="btn-masuk"
        onclick="tambahTransaksi()">
        💾 Simpan Transaksi
      </button>

    </div>


    <!-- RIWAYAT -->
    <div class="card">

      <h3>📋 Riwayat Transaksi</h3>

      <div id="daftar"></div>

    </div>

  </div>

  <footer>
    Sistem Informasi Kas RT
  </footer>


<script>

  /* =========================
     DATA TRANSAKSI
  ========================= */

  let transaksi = [];

  /* Ambil data dari localStorage */
  try {
    const data = localStorage.getItem("kasRT");

    if (data) {
      transaksi = JSON.parse(data);
    }

    if (!Array.isArray(transaksi)) {
      transaksi = [];
    }

  } catch (error) {
    transaksi = [];
  }


  /* =========================
     FORMAT RUPIAH
  ========================= */

  function rupiah(angka) {
    return new Intl.NumberFormat("id-ID", {
      style: "currency",
      currency: "IDR",
      maximumFractionDigits: 0
    }).format(angka);
  }


  /* =========================
     SIMPAN DATA
  ========================= */

  function simpan() {
    localStorage.setItem(
      "kasRT",
      JSON.stringify(transaksi)
    );
  }


  /* =========================
     TAMBAH TRANSAKSI
  ========================= */

  function tambahTransaksi() {

    const inputKeterangan =
      document.getElementById("keterangan");

    const inputJumlah =
      document.getElementById("jumlah");

    const inputJenis =
      document.getElementById("jenis");


    const keterangan =
      inputKeterangan.value.trim();

    const jumlah =
      Number(inputJumlah.value);

    const jenis =
      inputJenis.value;


    /* Validasi */
    if (!keterangan) {
      alert("Keterangan belum diisi.");
      inputKeterangan.focus();
      return;
    }

    if (!jumlah || jumlah <= 0) {
      alert("Jumlah uang harus lebih dari 0.");
      inputJumlah.focus();
      return;
    }


    /* Masukkan transaksi */
    transaksi.push({

      id: Date.now(),

      keterangan: keterangan,

      jumlah: jumlah,

      jenis: jenis,

      tanggal: new Date().toLocaleString("id-ID")

    });


    /* Simpan */
    simpan();


    /* Kosongkan form */
    inputKeterangan.value = "";
    inputJumlah.value = "";


    /* Tampilkan */
    tampilkan();


    alert("Transaksi berhasil disimpan.");

  }


  /* =========================
     EDIT TRANSAKSI
  ========================= */

  function editTransaksi(id) {

    const item =
      transaksi.find(function(data) {
        return data.id === id;
      });


    if (!item) {
      return;
    }


    const keteranganBaru =
      prompt(
        "Ubah keterangan:",
        item.keterangan
      );


    if (keteranganBaru === null) {
      return;
    }


    const jumlahBaru =
      prompt(
        "Ubah jumlah uang:",
        item.jumlah
      );


    if (jumlahBaru === null) {
      return;
    }


    const jumlah =
      Number(jumlahBaru);


    if (!keteranganBaru.trim() || !jumlah || jumlah <= 0) {

      alert(
        "Keterangan dan jumlah harus benar."
      );

      return;
    }


    item.keterangan =
      keteranganBaru.trim();

    item.jumlah =
      jumlah;


    simpan();

    tampilkan();

  }


  /* =========================
     HAPUS TRANSAKSI
  ========================= */

  function hapusTransaksi(id) {

    const yakin =
      confirm(
        "Yakin ingin menghapus transaksi ini?"
      );


    if (!yakin) {
      return;
    }


    transaksi =
      transaksi.filter(function(item) {
        return item.id !== id;
      });


    simpan();

    tampilkan();

  }


  /* =========================
     TAMPILKAN DATA
  ========================= */

  function tampilkan() {

    let pemasukan = 0;
    let pengeluaran = 0;


    /* Hitung saldo */
    transaksi.forEach(function(item) {

      if (item.jenis === "masuk") {

        pemasukan += Number(item.jumlah);

      } else {

        pengeluaran += Number(item.jumlah);

      }

    });


    const saldo =
      pemasukan - pengeluaran;


    /* Tampilkan ringkasan */
    document.getElementById("pemasukan").textContent =
      rupiah(pemasukan);

    document.getElementById("pengeluaran").textContent =
      rupiah(pengeluaran);

    document.getElementById("saldo").textContent =
      rupiah(saldo);


    /* Daftar transaksi */
    const daftar =
      document.getElementById("daftar");


    if (transaksi.length === 0) {

      daftar.innerHTML =
        '<div class="kosong">Belum ada transaksi.</div>';

      return;
    }


    daftar.innerHTML = "";


    /* Transaksi terbaru di atas */
    const dataTerbaru =
      [...transaksi].reverse();


    dataTerbaru.forEach(function(item) {

      const div =
        document.createElement("div");


      div.className =
        "transaksi";


      const warna =
        item.jenis === "masuk"
          ? "masuk"
          : "keluar";


      const tanda =
        item.jenis === "masuk"
          ? "+"
          : "-";


      div.innerHTML = `

        <div class="transaksi-header">

          <span>
            ${item.keterangan}
          </span>

          <span class="${warna}">
            ${tanda} ${rupiah(item.jumlah)}
          </span>

        </div>

        <small>
          ${item.tanggal}
        </small>

        <button
          type="button"
          class="edit"
          onclick="editTransaksi(${item.id})">
          ✏️ Edit
        </button>

        <button
          type="button"
          class="hapus"
          onclick="hapusTransaksi(${item.id})">
          🗑️ Hapus
        </button>

      `;


      daftar.appendChild(div);

    });

  }


  /* =========================
     JALANKAN SAAT HALAMAN DIBUKA
  ========================= */

/* =========================
   DATA WARGA
========================= */

let warga = JSON.parse(
  localStorage.getItem("dataWarga")
) || [];

function simpanWarga() {
  localStorage.setItem(
    "dataWarga",
    JSON.stringify(warga)
  );
}

function tambahWarga() {

  const nama = document
    .getElementById("namaWarga")
    .value
    .trim();

  const rumah = document
    .getElementById("rumahWarga")
    .value
    .trim();

  const hp = document
    .getElementById("hpWarga")
    .value
    .trim();

  if (!nama || !rumah) {
    alert("Nama dan nomor rumah wajib diisi.");
    return;
  }

  warga.push({
    id: Date.now(),
    nama: nama,
    rumah: rumah,
    hp: hp
  });

  simpanWarga();

  document.getElementById("namaWarga").value = "";
  document.getElementById("rumahWarga").value = "";
  document.getElementById("hpWarga").value = "";

  tampilkanWarga();
}

function hapusWarga(id) {

  const yakin = confirm(
    "Yakin ingin menghapus data warga ini?"
  );

  if (!yakin) {
    return;
  }

  warga = warga.filter(function(item) {
    return item.id !== id;
  });

  simpanWarga();
  tampilkanWarga();
}

function tampilkanWarga() {

  const daftar = document
    .getElementById("daftarWarga");

  if (warga.length === 0) {

    daftar.innerHTML =
      '<div class="kosong">Belum ada data warga.</div>';

    return;
  }

  daftar.innerHTML = "";

  warga.forEach(function(item) {

    const div = document.createElement("div");

    div.className = "transaksi";

    div.innerHTML = `
      <div class="transaksi-header">
        <span>👤 ${item.nama}</span>
        <span>🏠 ${item.rumah}</span>
      </div>

      <small>
        📞 ${item.hp || "Nomor HP belum diisi"}
      </small>

      <br><br>

      <button
        type="button"
        class="hapus"
        onclick="hapusWarga(${item.id})"
      >
        🗑️ Hapus
      </button>
    `;

    daftar.appendChild(div);
  });
}

tampilkanWarga();

tampilkan();
document.querySelectorAll(".menu a").forEach(function(menu) {
  menu.addEventListener("click", function(e) {
    const tujuan = this.getAttribute("href");

    if (tujuan && tujuan.startsWith("#")) {
      e.preventDefault();

      const bagian = document.querySelector(tujuan);

      if (bagian) {
        bagian.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      }
    }
  });
});
</script>

</body>
</html>
